<script>

if(innerWidth > innerHeight){
    document.getElementById("SCROLL").style.width = (innerHeight - innerWidth - 20).toString() + "px";
    document.getElementById("SCROLL").style.height = (innerHeight - 20).toString() + "px";

}
else{
    document.getElementById("SCROLL").style.width = (innerWidth - 20).toString() + "px";
    document.getElementById("SCROLL").style.height = (innerHeight - innerWidth - 20).toString() + "px";
}

simulation = {};
//simulation.mu = 1.0;//mean
//simulation.sigma = 1;//standard deviation
//simulation.n = 1000;//number of points
//savejson();

document.getElementById("SAVE-DATA-BUTTON").onclick = function(){
    document.getElementById("DATA-IO-PORT").value = JSON.stringify(data,null,"    ");
    var httpc = new XMLHttpRequest();
    httpc.open("POST", "save-file.php", true);
    httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
    httpc.send("data="+encodeURIComponent(JSON.stringify(data,null,"    "))+"&filename=data.txt");//send text to save-file.php
}

document.getElementById("MU-INPUT").onchange = function(){
    simulation.mu = parseFloat(this.value);
    savejson();
}

document.getElementById("SIGMA-INPUT").onchange = function(){
    simulation.sigma = parseFloat(this.value);
    savejson();
}
document.getElementById("N-INPUT").onchange = function(){
    simulation.n = parseFloat(this.value);
    savejson();
}


function setup() {
    squareWidth = 100;

    if(innerWidth > innerHeight){
        squareWidth = innerHeight - 20;
    }
    else{
        squareWidth = innerWidth - 20;  
    }
    createCanvas(squareWidth, squareWidth);
    stroke(0);
    strokeWeight(10);
    data = [];
    for(var index = 0;index < simulation.n;index++){
        gaussianrandom = randomGaussian(simulation.mu,simulation.sigma);
        data.push(gaussianrandom);
    }
    frameRate(30);
    noFill();
    var httpc = new XMLHttpRequest();

    simulation = {};
    httpc.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            simulation = JSON.parse(this.responseText);
            document.getElementById("MU-INPUT").value = simulation.mu.toString();
            document.getElementById("SIGMA-INPUT").value = simulation.sigma.toString();
            document.getElementById("N-INPUT").value = simulation.n.toString();

        }
    };
    httpc.open("GET", "load-file.php?filename=simulation.txt", true);
    httpc.send();
    
}



function draw(){
    clear(0);
    background(0);
    data = [];
    strokeWeight(5);
    stroke(0,255,0);
    for(var index = 0;index < simulation.n;index++){
        datapoint = randomGaussian(simulation.mu,simulation.sigma);
        data.push(datapoint);
        point(map(datapoint,simulation.mu - 10*simulation.sigma,simulation.mu + 10*simulation.sigma,squareWidth,0),map(index,0,simulation.n,0,squareWidth));
    }
    strokeWeight(10);

}


function savejson(){
    var httpc = new XMLHttpRequest();
    httpc.open("POST", "save-file.php", true);
    httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
    httpc.send("data="+encodeURIComponent(JSON.stringify(simulation,null,"    "))+"&filename=simulation.txt");//send text to save-file.php

}
globalurl = window.location.href;
codesquaresize = 100;
qrcode = new QRCode(document.getElementById("QRCODE"), {
	text: globalurl,
	width: codesquaresize,
	height: codesquaresize,
	colorDark : "#000000",
	colorLight : "#ffffff",
	correctLevel : QRCode.CorrectLevel.H
});
</script>
