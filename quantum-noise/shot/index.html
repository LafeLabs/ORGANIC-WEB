<script>

graphsize = 100;

if(innerWidth > innerHeight){
    squaresize = innerHeight;
    document.getElementById("scroll").style.width = (innerWidth - innerHeight).toString() + "px";
    document.getElementById("scroll").style.top = "0px";
}
else{
    squaresize = innerWidth;
    document.getElementById("scroll").style.top = squaresize.toString() + "px";
    document.getElementById("scroll").style.left = "0px";    
}


n = 1;


function setup() {
  createCanvas(squaresize, squaresize);    
  strokeWeight(2);  
  textSize(70);
}


timeindex = 0;
nwave = [];
function draw(){
  background(0);
  
  number_of_channels = mouseX*1000;
  exponent = map(mouseY,height,0,-6,-3);
  transmission = 10**exponent;
//  0.01;
  n = 0;
  for(var index = 0;index < number_of_channels;index++){
      if(random() < transmission){
          n +=1;
      }
  }
  nwave.push(n);
  stroke("#00ff00");
  fill("#00ff00");
  text("n = " + n.toString(),30,60);
  text(number_of_channels.toString() +  " channels",30,130);
  text("t = " + transmission.toString(),30,190);

  for(var index = 0;index < n;index++){
      circle(random(0,width),random(height/2,height),10);
  }
  circle(timeindex,map(n,0,10000,height/2,0),10);
  noFill();
  beginShape();
  for(var index = 0;index < nwave.length;index++){
      vertex(index*5,map(nwave[index],0,10000,height/2,0));
  }
  endShape();

  timeindex +=5;
  if(timeindex > width){
      timeindex = 0;
      make_n_histogram();
      nwave = [];

  }
}
