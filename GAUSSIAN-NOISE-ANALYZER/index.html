<script>
simulation = {};
simulation.mu = 1.0;//mean
simulation.sigma = 1;//standard deviation
simulation.n = 1000;//number of points

document.getElementById("MU-INPUT").value = simulation.mu.toString();
document.getElementById("SIGMA-INPUT").value = simulation.sigma.toString();
document.getElementById("N-INPUT").value = simulation.n.toString();

function setup() {
    squareWidth = 100;

    if(innerWidth > innerHeight){
        squareWidth = innerHeight - 100;
    }
    else{
        squareWidth = innerWidth - 100;
    }
    
    createCanvas(squareWidth, squareWidth);
    stroke(0);
    strokeWeight(10);
    data = [];
    for(var index = 0;index < simulation.n;index++){
        gaussianrandom = randomGaussian(simulation.mu,simulation.sigma);
        data.push(gaussianrandom);
    }
    frameRate(30);
    noFill();
}

binCount = 100;
numberofsigma = 5;
let binRanges = [];
let binCounts = [];
let maxValue;

fit = {};
fit.mu = 1.0;//
fit.sigma = 1.0;

histogram = {};
histogram.nbins = 101;
histogram.totalwidth = 10.0;
histogram.binwidth = histogram.totalwidth/histogram.nbins;
histogram.center = 1.0;
histogram.bincounts = new Array(histogram.nbins).fill(0);



function draw(){
    clear(0);
    background(0);
    data = [];
    strokeWeight(5);
    stroke(0,255,0);
    for(var index = 0;index < simulation.n;index++){
        datapoint = randomGaussian(simulation.mu,simulation.sigma);
        data.push(datapoint);
        point(map(datapoint,simulation.mu - 10*simulation.sigma,simulation.mu + 10*simulation.sigma,squareWidth,0),map(index,0,simulation.n,0,0.5*squareWidth));
    }
    strokeWeight(10);

    for(var index = 0;index < histogram.nbins;index++){
        histogram.bincounts[index] = 0;
    }
    
    for(var index = 0;index < data.length;index++){
        binindex = 0;
        for(lowerbound = histogram.center - 0.5*(histogram.nbins - 1)*histogram.binwidth;lowerbound < histogram.center + 0.5*(histogram.nbins - 1)*histogram.binwidth;lowerbound += histogram.binwidth){
            if(data[index] > lowerbound && data[index] < lowerbound + histogram.binwidth){
                histogram.bincounts[binindex]++;
            }
            binindex++;
        }        
    }
    for(var index = 0;index < histogram.nbins;index++){
        line(map(index,0,histogram.nbins,0,squareWidth),squareWidth-200,map(index,0,histogram.nbins,0,squareWidth),map(histogram.bincounts[index],0,data.length,squareWidth-200,-3.5*squareWidth))
    }
    stroke(255,0,255);
    beginShape();
    for(var index = 0;index < histogram.nbins;index++){
        vertex(map(index,0,histogram.nbins,0,squareWidth),map(histogram.bincounts[index],0,data.length,squareWidth-200,-3.5*squareWidth));
    }
    endShape();
    
}

globalurl = window.location.href;
codesquaresize = 100;
qrcode = new QRCode(document.getElementById("QRCODE"), {
	text: globalurl,
	width: codesquaresize,
	height: codesquaresize,
	colorDark : "#000000",
	colorLight : "#ffffff",
	correctLevel : QRCode.CorrectLevel.H
});
</script>
