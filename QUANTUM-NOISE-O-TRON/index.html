<style>

<script>
function setup() {

  createCanvas(innerWidth - 20, innerHeight - 110);    
  strokeWeight(1);  
  background(200);
  noFill();
  stroke(0);
  fill(0);
  textSize(50);
}


frameindex =0;
xy = {};
xy.x = 0;// from 0 to 1
xy.y = 0;// from 0 to 1
xy.z = 0;// integers with no bound, always restarts to zero on reload then scrolls up and down

lock = false;

voltage_offset_max = 100;
voltage_offset_min = -100;
voltage_offset = voltage_offset_min;

audio_sine_amplitude_max = 100;
audio_sine_amplitude_min = 1;
audio_sine_amplitude = audio_sine_amplitude_min;
radio_signal_power_min = 1;
radio_signal_power_min = 100;

function draw(){
  background(200);
  frameindex++;
    xy.x = mouseX/width;// from 0 to 1
    xy.y = (height - mouseY)/height;// from 0 to 1
    //limit to the range from 0 to 1
    if(xy.x > 1){
        xy.x = 1;
    }
    if(xy.x < 0){
        xy.x = 0;
    }
    if(xy.y > 1){
        xy.y = 1;
    }
    if(xy.y < 0){
        xy.y = 0;
    }
    xy.x = round(xy.x*1000)/1000;//round to 3 digits
    xy.y = round(xy.y*1000)/1000;//round to 3 digits

  
  stroke("red");
  noFill();
  beginShape();
  strokeWeight(10);
  for (var y = height - 10; y > height/2; y--){
     vertex(width/2 + 20*Math.cos((2*Math.PI*y/100) + 0.1*frameindex),y);
  }
  endShape();


  stroke("blue");
  noFill();
  beginShape();
  strokeWeight(10);
  for (var x = 10; x < width/2; x++){
     vertex(x,height/2 + 20*Math.cos((2*Math.PI*x/100) - 0.1*frameindex));
  }
  endShape();
  stroke("green");
  noFill();
  beginShape();
  strokeWeight(10);
  for (var x = width/2 + 300; x < width; x++){
     vertex(x,height/2 + 20*Math.cos((2*Math.PI*x/100) - 0.1*frameindex));
  }
  endShape();

  stroke("#ff00ff");
  noFill();
  beginShape();
  strokeWeight(30);
  for (var x = width/2; x < width/2 + 300; x++){
     vertex(x,height/2 + 20*Math.cos((2*Math.PI*x/100) - 0.1*frameindex));
  }
  endShape();


  stroke("#ff00ff");
  fill("#ff00ff");
  circle(width/2,height/2,100 + 25*Math.cos(frameindex*Math.PI*2/50));
  if(frameindex >= 1e5){
    frameindex = 0;
  }
  
  
}

direction = '';
function mouseWheel(event) {
  if (event.delta > 0) {
    direction = 'mouse wheel down';
    xy.z--;
  } else {
    direction = 'mouse wheel up';
    xy.z++;
  }
  // Uncomment to prevent any default behavior.
  // return false;
}

function mouseClicked() {
  lock = !lock;
}


</script>
