<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!--

        <title>noise modulator</title>
<link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAA/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEQEQAAAAAAEAAAEAAAAAEAAAABAAAAEAAAAAAQAAEAAAAAAAEAEAAAAAAAABD//wAA//8AAP//AAAAAAAA/v8AAP7/AAD+/wAA/v8AAP7/AAD+/wAA+D8AAPbfAADu7wAA3vcAAL77AAB+/QAA" rel="icon" type="image/x-icon">

    <!--Stop Google:-->
    <META NAME="robots" CONTENT="noindex,nofollow">
<!--geometron javascript library-->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.js"></script>
    <script src = "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.js"></script>
    <script src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id = "whitesquare">
<div id = "qrcode"></div>
</div>
<script>

graphsize = 100;

n = 1;

let noise;
noiseon = false;

function setup() {
  createCanvas(innerWidth, innerHeight);    
  strokeWeight(2);  
  textSize(70);
  noise = new p5.Noise();   
  noise.start();
  
    
}


timeindex = 0;
nwave = [];
function draw(){
  background(0);
  strokeWeight(10);  
  number_of_channels = mouseX*1000;
  exponent = map(mouseY,height,0,-6,-2);
  transmission = 10**exponent;
//  0.01;
  n = 0;
  for(var index = 0;index < number_of_channels;index++){
      if(random() < transmission){
          n +=1;
      }
  }
  nwave.push(n);
  stroke("#00ff00");
  fill("#00ff00");
  //text("n = " + n.toString(),30,60);
 // text(number_of_channels.toString() +  " channels",30,130);
//  text("t = " + transmission.toString(),30,190);
  n_average = 0;
  for(var index = 0;index < n;index++){
      circle(random(0,width),random(0,height),10);
  }
  noFill();

  stroke("red");  
  noFill();
  beginShape();
  for(var index = 0;index < nwave.length;index++){
      vertex(index*5,map(nwave[index],0,10000,height/2,0));
      n_average += nwave[index];

  }
  endShape();
  n_average = n_average/nwave.length;
  stroke("blue");  
  beginShape();
  for(var index = 0;index < nwave.length;index++){
      vertex(index*5,map(nwave[index] - nwave[nwave.length - 1],0,100,height/2,0));
  }
  endShape();

  sinemag = 100;
  sineperiod = 100;
  stroke("orange");  
  beginShape();
  for(var index = 0;index < nwave.length;index++){
      vertex(index*5,height/2 - 0.00001*((nwave[index] - nwave[nwave.length - 1])*sinemag*Math.sin((index*5)*2*Math.PI/sineperiod))**2);
  }
  endShape();
  stroke("yellow");  
  beginShape();
  for(var index = 0;index < nwave.length;index++){
      vertex(index*5,height/2 - 0.00001*((nwave[index] - nwave[nwave.length - 1])*sinemag*Math.cos((index*5)*2*Math.PI/sineperiod))**2);
  }
  endShape();

  stroke("purple");  
  fill("purple");
  circle(timeindex,map(n,0,10000,height/2,0),50);
  noise.amp(n/1000);

  timeindex +=5;
  if(timeindex > width){
      timeindex = 0;
      nwave = [];

  }
}


document.body.onclick = function(){
    if(noiseon == false){
        noise.start();
        noiseon = true;
    }
    else{
        noise.stop();
        noiseon = false;
        
    }
}

codesquaresize = 160;
globalurl = window.location.href;
qrcode = new QRCode(document.getElementById("qrcode"), {
	text: globalurl,
	width: codesquaresize,
	height: codesquaresize,
	colorDark : "#000000",
	colorLight : "#ffffff",
	correctLevel : QRCode.CorrectLevel.H
});

</script>
<style>
body{
    overflow:hidden;
    background-color:#eeeeee;
    font-family:Arial;
}
#whitesquare{
    position:absolute;
    right:0px;
    top:0px;
    width:200px;
    height:200px;
    z-index:10;
    background-color:white;
}
#qrcode{
    position:absolute;
    left:20px;
    top:20px;
}
main{
    position:absolute;
    left:0px;
    top:0px;
    z-index:0;
}
main canvas{
    position:absolute;
    z-index:0;
}

</style>
</body>
</html>
