<script>

margin = 10;//margin in px
squaretime = 0;
v = 0;
graphsize = 100;

if(innerWidth > innerHeight){
    squaresize = innerHeight;
    document.getElementById("scroll").style.width = (innerWidth - innerHeight).toString() + "px";
    document.getElementById("scroll").style.top = "0px";
}
else{
    squaresize = innerWidth;
    document.getElementById("scroll").style.top = squaresize.toString() + "px";
    document.getElementById("scroll").style.left = "0px";    
}


graphsize = squaresize;

T = graphsize/100;//temperature in px units
vmax = graphsize/2;//voltage oscillation magnitude in px units
v = vmax;
fermizero = 0.5*graphsize;
fermiheight = 0.2*graphsize;
period = 25;//period in frames
photonenergy = 0.18*graphsize;

mustachex0 = 0.5*graphsize;
mustachey0 = graphsize;


function setup() {
    T = graphsize/100;//temperature in px units
    vmax = graphsize/2;//voltage oscillation magnitude in px units
    v = vmax;
    fermizero = 0.5*graphsize;
    fermiheight = 0.2*graphsize;
    period = 25;//period in frames
    photonenergy = 0.18*graphsize;
    
    mustachex0 = 0.5*graphsize;
    mustachey0 = graphsize;

   createCanvas(squaresize, squaresize);    
   strokeWeight(2);  
   background("#F8F0E3");
   background("black");
   textSize(24);
}


timeindex = 0;

xindex = 0;
vwave = [];
pwave = [];

photonindex= 0;
function draw(){
    T = graphsize/4;//temperature in px units
    
  photonenergy = 100 + photonindex/4;//units of pixels
  if(mouseX > 0){
      v_pp = Math.abs((mouseX - mustachex0));
  }
  else{
      v_pp = 0;
  }

  
  for(v_pp = 0;v_pp < squaresize;v_pp +=5){
       v = 0;
       p = 4*0.5*(((0.5*v + photonenergy)/Math.tanh((0.5*v + photonenergy)/(2*T)))  + ((0.5*v - photonenergy)/Math.tanh((0.5*v - photonenergy)/(2*T))));
       pmax = p;
       pmin = p;
       for(var audio_time = 0;audio_time < 512;audio_time++){
          v = v_pp*Math.sin(2*Math.PI*audio_time/32);


            T = mouseX/4;

          p = 4*0.5*(((0.5*v + photonenergy)/Math.tanh((0.5*v + photonenergy)/(2*T)))  + ((0.5*v - photonenergy)/Math.tanh((0.5*v - photonenergy)/(2*T))));      
          if(p > pmax){
              pmax = p;
          }
          if(p < pmin){
              pmin = p;
          }
       }
       p = pmax - pmin;
       
       fill(colorwheel(map(p,0,2500,0,360)));
       stroke(colorwheel(map(p,0,2500,0,360)));
       circle(v_pp,height-photonindex,5)      
       if(p > 300 && p < 310){
           fill(0);
           stroke(0);
           circle(v_pp,height-photonindex,5)      
       }
  }
  photonindex +=5;
  if(photonindex>height){
      savepng();
      photonindex=0;
      background(0);
  }
}


codesquaresize = 170;
globalurl = window.location.href;
qrcode = new QRCode(document.getElementById("qrcode"), {

});


function savepng(){
    png64 = document.getElementById("defaultCanvas0").toDataURL("image/png");
    var timestamp = Math.round((new Date().getTime())/1000).toString();
    var httpc = new XMLHttpRequest();
    
    var url = "save-png.php";        
    httpc.open("POST", url, true);
    httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    httpc.send("data="+encodeURIComponent(png64.substring(22))+"&filename=square" + timestamp +  ".png");//send text to filesaver.php
     //location.reload(); 
     
    newfilename = "square" + timestamp +  ".png";
    
    var newbox = document.createElement("DIV");
    newbox.classList.add("imagebox");         
    
    var deletespan = document.createElement("SPAN");
    deletespan.innerHTML = "X";
    deletespan.classList.add("deletespan");
    deletespan.onclick = function(){
        //delete the parent div of the image
        //delete the file
        var filename = this.parentElement.getElementsByClassName("filelabel")[0].innerHTML; 
        var httpc = new XMLHttpRequest();
        var url = "delete-file.php";         
        httpc.open("POST", url, true);
        httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
        httpc.send("filename=" + filename);//send text to deletefile.php
        this.parentElement.parentElement.removeChild(this.parentElement);
    }
    
    newbox.appendChild(deletespan);

    var newdiv = document.createElement("DIV");
    newdiv.innerHTML = newfilename;
    newdiv.className = "filelabel";
    newbox.appendChild(newdiv);

    var newimg = document.createElement("IMG");
    newimg.src = png64;
    newimg.classList.add("uploadimage");
    newimg.classList.add("button");
    newbox.appendChild(newimg);    


    document.getElementById("feedscroll").insertBefore(newbox,document.getElementById("feedscroll").getElementsByClassName("imagebox")[0]);
    
}



upuploadImages = [];
var httpc9 = new XMLHttpRequest();
    httpc9.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        upuploadImages = JSON.parse(this.responseText);
        for(var index = upuploadImages.length - 1;index >= 0;index--) {
            if(upuploadImages[index].includes(".png") && upuploadImages[index].includes("square")){
                var newbox = document.createElement("DIV");
                newbox.classList.add("imagebox");         
                
                var deletespan = document.createElement("SPAN");
                deletespan.innerHTML = "X";
                deletespan.classList.add("deletespan");
                deletespan.onclick = function(){
                    //delete the parent div of the image
                    //delete the file
                    var filename = this.parentElement.getElementsByClassName("filelabel")[0].innerHTML; 
                    var httpc = new XMLHttpRequest();
                    var url = "delete-file.php";         
                    httpc.open("POST", url, true);
                    httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
                    httpc.send("filename=" + filename);//send text to deletefile.php
                    this.parentElement.parentElement.removeChild(this.parentElement);
                }
                
                newbox.appendChild(deletespan);
        
                var newdiv = document.createElement("DIV");
                newdiv.innerHTML = upuploadImages[index];
                newdiv.className = "filelabel";
                newbox.appendChild(newdiv);
            
                
                document.getElementById("feedscroll").appendChild(newbox);
                var newimg = document.createElement("IMG");
                newimg.src = upuploadImages[index];
                newimg.classList.add("uploadimage");
                newimg.classList.add("button");
                newbox.appendChild(newimg);
                
                newimg.onclick = function(){
                    img = loadImage(this.src);
                    loadImage(this.src, img => {
                        image(img, 0, 0,squareWidth-50,squareWidth-70);
                    });
                }
            }
        }
    }
};
