<script>
baseurl = "https://raw.githubusercontent.com/lafefspietz/organic-web/refs/heads/main/JPA/data091825-base/scan3/trace0.s2p";

for(var index = 0;index < 100;index++){
    filename = "trace" + index.toString() + ".s2p";
    fileurl = baseurl + filename; 
    var httpc = new XMLHttpRequest();
    httpc.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            filedata = this.responseText;
            var httpc2 = new XMLHttpRequest();
            var url = "save-file.php";        
            httpc2.open("POST", url, true);
            httpc2.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
            httpc2.send("data="+filedata+"&filename=ampdata/" + filename);//send text to save-file.php
        }
    };

    httpc.open("GET", "load-file.php?filename=" + fileurl, true);
    httpc.send();    
}

</script>
