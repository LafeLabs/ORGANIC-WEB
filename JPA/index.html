<style>
body{
    font-family:Arial;
    background-color:#404040;
}
a{
    color:#ff2cb4;
}
#editlink{
    position:absolute;
    left:5px;
    botom:5px;
    z-index:2;
    font-size:2em;
}
main{
    position:absolute;
    right:0px;
    top:0px;
    cursor:pointer;
}
</style>
<script>


function setup() {
  createCanvas(innerHeight,innerHeight);    
  strokeWeight(1);  
}


function draw(){
    clear();
    stroke("#0CCDDF");
    noFill();
    background(10);
    strokeWeight(1);
    for(var index = 1;index < 10;index++){
        line(index*0.1*width,0,index*0.1*width,height);
        line(0,index*0.1*height,width,index*0.1*height);
    }
    fill("#0CCDDF");
    textSize(width*0.1);
    text("V = ",10,0.6*height + 2*width*0.1 -20);
    text("P = ",10,0.8*height + 2*width*0.1 -20);

    strokeWeight(10);  
    line(0,0.6*height,width,0.6*height);
}


</script>
